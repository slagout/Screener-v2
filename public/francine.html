<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Francine - Francine Screener</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-left">
                <h1>Francine Screener</h1>
                <span class="user-role">Trader</span>
            </div>
            <div class="header-right">
                <span class="user-name">Francine</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="dashboard-content">
            <nav class="sidebar">
                <ul>
                    <li><a href="#" class="active">Dashboard</a></li>
                    <li><a href="#">Screening</a></li>
                    <li><a href="#">Portfolio</a></li>
                    <li><a href="#">Trades</a></li>
                    <li><a href="#">Settings</a></li>
                </ul>
            </nav>

            <main class="main-content">
                <div class="welcome-section">
                    <h2>Welcome, Francine</h2>
                    <p>Trader dashboard for quick screening and portfolio management</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Trades Executed</h3>
                        <p>234</p>
                    </div>
                    <div class="stat-card">
                        <h3>Qualified Stocks</h3>
                        <p>42</p>
                    </div>
                    <div class="stat-card">
                        <h3>Portfolio Value</h3>
                        <p>$2.1M</p>
                    </div>
                    <div class="stat-card">
                        <h3>Win Rate</h3>
                        <p>78%</p>
                    </div>
                </div>

                <div class="screening-section">
                    <h3>Quick Screening</h3>
                    <div class="screening-form">
                        <div class="form-group">
                            <label>Price Range ($)</label>
                            <input type="text" placeholder="From - To" value="$20 - $100">
                        </div>
                        <div class="form-group">
                            <label>IV Range (%)</label>
                            <input type="text" placeholder="Min - Max" value="30 - 45%">
                        </div>
                        <div class="form-group">
                            <label>Min Volume</label>
                            <input type="text" placeholder="Shares" value="1,000,000">
                        </div>
                        <button class="run-button">RUN FRANCINE SCREEN v2</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <script>
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
